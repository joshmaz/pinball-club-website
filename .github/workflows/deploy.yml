name: Deploy to AWS S3

on:
  push:
    branches: [ staging, main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    if: ${{ github.ref_name == 'staging' || github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ github.ref_name == 'staging' && 'us-east-1' || secrets.AWS_REGION }}
      S3_BUCKET: ${{ github.ref_name == 'staging' && 'snhpc-staging-site-049145893448-us-east-1' || secrets.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ github.ref_name == 'staging' && 'E2MOL1K6PBXXFF' || secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_ENV: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}

    steps:
    - uses: actions/checkout@v4

    - name: Detect clean URL function changes
      id: clean-url
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        node --input-type=module <<'NODE'
        import { appendFileSync, readFileSync } from 'node:fs';

        const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
        const path = 'cloudfront/clean-url-rewrite.js';
        const changed = process.env.EVENT_NAME === 'workflow_dispatch' ||
          (event.commits || []).some((commit) =>
            ['added', 'modified', 'removed'].some((kind) => (commit[kind] || []).includes(path))
          );
        appendFileSync(process.env.GITHUB_OUTPUT, 'changed=' + String(changed) + '\\n');
        NODE

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install build and test dependencies
      run: npm ci

    - name: Build staging site
      if: ${{ github.ref_name == 'staging' }}
      env:
        SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        GAMES_CATALOG_SOURCE: db
        CONTEXT: production
        BRANCH: staging
      run: node scripts/build-site.mjs

    - name: Build production site
      if: ${{ github.ref_name == 'main' }}
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        GAMES_CATALOG_SOURCE: db
        CONTEXT: production
        BRANCH: main
      run: node scripts/build-site.mjs

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ github.ref_name == 'staging' && 'arn:aws:iam::049145893448:role/GitHubActionsS3DeployStagingRole' || secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy public site to S3
      run: aws s3 sync dist/ "s3://${{ env.S3_BUCKET }}/" --delete

    - name: Publish tested CloudFront rewrite function
      if: ${{ steps.clean-url.outputs.changed == 'true' }}
      run: node scripts/deploy-cloudfront-function.mjs

    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" \
          --paths "/*"
