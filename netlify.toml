[build]
  command = "node scripts/build-site.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  GAMES_CATALOG_SOURCE = "db"

# Preserve .html URLs used by sign-in redirects and Member Tools routing.
[build.processing.html]
  pretty_urls = false

# Keep the alternate store at the short URL while serving the static page.
[[redirects]]
  from = "/store"
  to = "/store.html"
  status = 200
  force = true

[[redirects]]
  from = "/slideshow"
  to = "/slideshow.html"
  status = 200
  force = true

[[redirects]]
  from = "/slideshow/play"
  to = "/slideshow-play.html"
  status = 200
  force = true
