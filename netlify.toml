[build]
  ignore = "node scripts/netlify-ignore.mjs"
  command = "node scripts/build-site.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  GAMES_CATALOG_SOURCE = "db"\n\n[context.deploy-preview.environment]\n  SITE_ENV = "staging"

# Preserve .html URLs used by sign-in redirects and Member Tools routing.
[build.processing.html]
  pretty_urls = false

# Keep public friendly paths aligned with the CloudFront rewrite.
[[redirects]]
  from = "/donate"
  to = "/donate.html"
  status = 200
  force = true

[[redirects]]
  from = "/store"
  to = "/store.html"
  status = 200
  force = true

[[redirects]]
  from = "/slideshow"
  to = "/slideshow.html"
  status = 200
  force = true

[[redirects]]
  from = "/slideshow/play"
  to = "/slideshow-play.html"
  status = 200
  force = true
