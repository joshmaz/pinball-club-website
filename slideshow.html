<!doctype html>
<html lang="en" class="clubhouse"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>SNHPC - Slideshow</title>
<script src="/assets/js/theme.js"></script><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/clubhouse.css"><link rel="stylesheet" href="/assets/css/slideshow.css">
<script src="/assets/js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/assets/js/supabase-init.js"></script></head>
<body><a class="club-skip" href="#slideshow-main">Skip to slideshow</a>
<header id="page-top"><a class="club-brand" href="/index.html"><img src="/assets/images/SNHPC_logo_color.png" alt="Southern New Hampshire Pinball Club" width="150"></a><div class="club-header-links"><nav aria-label="Main navigation"><a href="/index.html">Home</a><a href="/events.html">Events</a><a href="/games.html">Games</a><a href="/merch.html">Merch</a><a href="/photos.html" aria-current="page">Photos</a><a href="/resources.html">Resources</a><a href="/about.html">About</a><a href="/signin.html" data-site-account-link>Members</a></nav><div class="club-header-utilities"><label class="club-theme-label" for="club-theme">Appearance <select id="club-theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label><span data-site-account-actions></span></div></div></header>
<main id="slideshow-main" class="content"><p class="club-eyebrow">Our club in pictures</p><h1>Club slideshow</h1><p>Choose your albums, then sit back and enjoy the memories.</p>
<p id="slide-status" role="status">Loading albums…</p><form id="slide-form"><fieldset><legend>Albums</legend><div class="slide-album-actions"><button type="button" id="slide-all">Select all</button><button type="button" id="slide-none">Clear all</button></div><div id="slide-albums"></div></fieldset>
<div class="slide-options"><label>Seconds per photo: <output id="slide-duration-value">5</output><input id="slide-duration" type="range" min="3" max="30" step="1" value="5"></label><label>Image framing <select id="slide-fit"><option value="fit">Fit entire image</option><option value="fill">Fill screen (crop)</option></select></label><label><input type="checkbox" id="slide-captions" checked> Show captions</label></div>
<div class="slide-actions"><button type="submit" id="slide-start">Start slideshow</button><button type="button" id="slide-copy">Copy link</button></div></form></main>
<footer><a href="#page-top" aria-label="Back to top"><img src="/assets/images/snhpc_logo_small_cropped.png" alt="SNH Pinball Club Logo" class="footer-logo"></a><p>©2026 Southern New Hampshire Pinball Club</p></footer>
<script src="/assets/js/clubhouse.js"></script><script src="/assets/js/site-auth.js"></script><script src="/assets/js/site-account.js"></script><script src="/assets/js/slideshow.js"></script></body></html>
